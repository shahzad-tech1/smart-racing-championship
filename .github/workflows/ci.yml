name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Using `npm install` until a package-lock.json is committed (the first
      # local `npm install` generates it). After that, switch back to
      # `cache: npm` above and `npm ci` here for reproducible, faster installs.
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
